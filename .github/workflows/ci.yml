# Runs the test suite and the dev retrieval check on GitHub's servers for every push to main and every pull request.
# No AWS credentials exist here, so any accidental live Bedrock or Titan call fails the run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      # The same check pytest runs (tests/test_retrieval.py), as its own step so the log shows the
      # dev retrieval table and which question dropped. Committed question vectors: no AWS call.
      - name: Dev retrieval check
        if: always()
        run: python -m eval.retrieval
