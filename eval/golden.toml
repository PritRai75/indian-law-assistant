[[question]]
id = "q006"
stage = "labelled"
persona = "frontline"
type = "payments_disclosures"
question = """
A customer paid her credit-card bill online at 7:30 p.m. Eastern on the due date, Tuesday, \
10 November 2026. Our website says payments after 5 p.m. Eastern count as next-day payments, so hers \
posted on 11 November and she was charged a late fee. Can we treat the payment as late and charge the fee?
"""
regulation = "Z"
gold_ids = ["1026.10(b)(2)(ii)"]
reference_answer = """
Under Regulation Z, a creditor may set a reasonable cut-off time for electronic payments on the due date, provided it is no earlier than 5 p.m. in the specified time zone. Because the customer made her online payment at 7:30 p.m. Eastern on the due date—after the permissible 5 p.m. Eastern cut-off time—the creditor may treat the payment as received on the next day and assess a late fee.
"""
key_facts = [
  "creditors may set an electronic payment cut-off time no earlier than 5 p.m. on the due date",
  "payments made after the 5 p.m. cut-off time may be treated as late and charged a fee"
]
should_abstain = false

