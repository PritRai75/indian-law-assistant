stage = "labelled"
persona = "compliance"
type = "deadline"
question = """
We received written notice on Thursday, 5 November 2026, that a gym took an ACH payment after the \
customer cancelled. Her account has been open since 2019, and the transfer was within the United \
States. What deadlines apply, and what are the dates?
"""
regulation = "E"
today = 2026-11-05
gold_ids = ["1005.11(c)(1)", "1005.11(c)(2)"]
reference_answer = """
Under Regulation E, after receiving written notice on Thursday, 5 November 2026, the institution must investigate and determine if an error occurred within 10 business days (by Friday, 20 November 2026). If the institution requires additional time, it must provisionally credit the account by 20 November 2026 and complete its investigation within 45 calendar days (by Sunday, 20 December 2026). Results of the investigation must be reported to the consumer within three business days of completion.
"""
key_facts = [
  "investigate or provisionally credit within 10 business days (20 November 2026)",
  "complete investigation within 45 calendar days (20 December 2026)"
]
should_abstain = false

