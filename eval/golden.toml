[[question]]
id = "q001"
stage = "labelled"
persona = "frontline"
type = "unauthorized"
trap = "debit vs credit (pair with q002)"
question = """
A customer says he still has his debit card in his wallet, but his statement dated 30 September 2026 \
shows online purchases on 18 and 22 September that he didn’t make. He noticed and reported them today, \
3 November 2026. What’s the most he could owe?
"""
regulation = "E"
today = 2026-11-03
gold_ids = ["1005.6(b)(3)"]
reference_answer = """
Taking the statement as sent on 30 September 2026, the customer reported the unauthorized transactions on 3 November 2026, which is within 60 calendar days of statement transmittal. Because the debit card was not lost or stolen, the consumer bears no liability under Regulation E for transfers occurring within this 60-day window. Therefore, the most he could owe is $0.
"""
key_facts = [
  "maximum liability is $0",
  "notice was given within 60 days of periodic statement transmittal"
]
should_abstain = false

[question.expected_tool_call]
name = "dispute_timeline"
args = { regulation = "E", event = "unauthorized", statement_sent = "2026-09-30", notice_date = "2026-11-03" }

[question.expected_result]
notice_timely = true
liability_tiers = ["none"]
deadlines = [
  { what = "60-day reporting window after periodic statement", date = 2026-11-29, rule = "1005.6(b)(3)" }
]

