# RegZE Assistant golden set. Written and labelled by Prit Raithatha.
# Format and checks: eval/golden.py. Check the file any time with:  python -m eval.golden
#
# One [[question]] block per question. TOML has no null: leave out any field that doesn't apply.
# Text in """ ... """ can span lines and contain "quotes". A \ at the end of a line joins it to the next
# line with no line break (used below to keep lines short). A # starts a comment.
#
# Pass 1 (stage = "draft"): id, stage, persona, type, question, and optionally trap (a private note).
# Pass 2 (stage = "labelled"), regulation open, in a separate sitting. Never reword a question to fit
# a label: relabel instead (a question that needs network rules, state law, a statute and so on
# becomes a decline). Fields:
#   regulation        "E", "Z" or "both" (leave out for most declines)
#   gold_ids          provision IDs exactly as in the index: rule paragraphs like "1005.6(b)(1)",
#                     comments like "1005.6(b)-1". The narrowest paragraph that fully answers.
#                     A gold ID also covers the paragraphs under it and the comments on them
#                     (exactly what python -m eval.lookup prints for it), so don't list those too.
#                     python -m eval.golden warns when one spans more than one rule chunk.
#                     Declines may list related provisions or none: gold_ids = []
#   reference_answer  two to four sentences a correct answer would say
#   key_facts         1 to 3 short facts the answer must contain (0 to 3 for a decline)
#   should_abstain    true for a decline; then type = "decline" and abstain_category is one of
#                     network_rules, state_law, issuer_terms, other_law, excluded_part,
#                     not_in_force, sign_off
#   today             the date the question treats as today, if it says one (unquoted: 2026-11-03)
#   uncertain         true leaves the question out of scoring (default false)
#   expected_tool_call / expected_result   only when the answer needs dispute_timeline. Compute the
#                     result by hand from the regulation text and a calendar first (labeling rule 3);
#                     python -m eval.golden then compares it with the tool. Investigate any mismatch.
#
# Types: unauthorized, dispute, deadline, fees_terms, payments_disclosures, reg_e_account, cross_reg,
# decline. The pass-1 types below are guesses; change them in pass 2 if the question is really another.
#
# A labelled block looks like this (placeholder values, not a real label):
#
# [[question]]
# id = "q999"
# stage = "labelled"
# persona = "compliance"
# type = "deadline"
# question = """..."""
# regulation = "E"
# today = 2026-11-05
# gold_ids = ["1005.x(y)(1)", "1005.x(y)-2"]
# reference_answer = """
# Two to four sentences.
# """
# key_facts = ["first fact", "second fact"]
# should_abstain = false
#
# [question.expected_tool_call]
# name = "dispute_timeline"
# args = { regulation = "E", event = "error", notice_date = "2026-11-05", transfer_kind = "standard" }
#
# [question.expected_result]
# notice_timely = true
# deadlines = [
#   { what = "first deadline in your words", date = 2026-11-19, rule = "1005.x(y)(1)" },
# ]
#
# (Put the two [question.…] tables after the plain fields of their block, as above.)


# ============================================================ batch 1 (session 13, 3 Nov 2026)

[[question]]
id = "q001"
stage = "labelled"
persona = "frontline"
type = "unauthorized"
trap = "debit vs credit (pair with q002)"
question = """
A customer says he still has his debit card in his wallet, but his statement dated 30 September 2026 \
shows online purchases on 18 and 22 September that he didn’t make. He noticed and reported them today, \
3 November 2026. What’s the most he could owe?
"""
regulation = "E"
today = 2026-11-03
gold_ids = ["1005.6(b)(3)"]
reference_answer = """
Taking the statement as sent on 30 September 2026, the customer reported the unauthorized transactions on 3 November 2026, which is within 60 calendar days of statement transmittal. Because the debit card was not lost or stolen, the consumer bears no liability under Regulation E for transfers occurring within this 60-day window. Therefore, the most he could owe is $0.
"""
key_facts = [
  "maximum liability is $0",
  "notice was given within 60 days of periodic statement transmittal"
]
should_abstain = false

[question.expected_tool_call]
name = "dispute_timeline"
args = { regulation = "E", event = "unauthorized", statement_sent = "2026-09-30", notice_date = "2026-11-03" }

[question.expected_result]
notice_timely = true
liability_tiers = ["none"]
deadlines = [
  { what = "60-day reporting window after periodic statement", date = 2026-11-29, rule = "1005.6(b)(3)" }
]

[[question]]
id = "q002"
stage = "labelled"
persona = "frontline"
type = "unauthorized"
trap = "debit vs credit (pair with q001)"
question = """
A customer says he still has his credit card in his wallet, but his statement dated 30 September 2026 \
shows online purchases on 18 and 22 September that he didn’t make. He noticed and reported them today, \
3 November 2026. What’s the most he could owe?
"""
regulation = "Z"
today = 2026-11-03
gold_ids = ["1026.12(b)(2)(iii)"]
reference_answer = """
Taking the statement as sent on 30 September 2026, the customer reported the unauthorized online credit card transactions on 3 November 2026. Under Regulation Z, the maximum liability for unauthorized credit card use cannot exceed $50, and because the credit card was not physically presented for the online purchases, the card issuer failed to provide a means of identification at the time of transaction. Therefore, no liability can be imposed, and the most the customer could owe is $0.
"""
key_facts = [
  "maximum liability is $0",
  "no liability for online transactions where the credit card is not presented"
]
should_abstain = false

[question.expected_tool_call]
name = "dispute_timeline"
args = { regulation = "Z", event = "unauthorized", notice_date = "2026-11-03" }

[question.expected_result]
liability_tiers = ["max_50"]
deadlines = []

[[question]]
id = "q003"
stage = "labelled"
persona = "frontline"
type = "dispute"
question = """
A customer paid $1,800 by credit card for a sofa on 10 August 2026. Delivery was promised by \
15 September, but it never arrived, and the charge is on her 30 September 2026 statement. She’s calling \
on 3 November 2026. Can she dispute it, and must she pay while it’s reviewed?
"""
regulation = "Z"
today = 2026-11-03
gold_ids = ["1026.13(a)(3)", "1026.13(b)(1)", "1026.13(d)(1)"]
reference_answer = """
Taking the statement as sent on 30 September 2026, the customer reported the non-delivery on 3 November 2026, which is within 60 days of periodic statement transmittal. Non-delivery of promised goods is a billing error under Regulation Z, so she can dispute the $1,800 charge. Pending resolution of the dispute, she is not required to pay the disputed amount, and the card issuer cannot attempt to collect it.
"""
key_facts = [
  "she can dispute the $1,800 charge as a billing error within 60 days of statement transmittal",
  "she is not required to pay the disputed amount while the billing error is reviewed"
]
should_abstain = false

[question.expected_tool_call]
name = "dispute_timeline"
args = { regulation = "Z", event = "error", statement_sent = "2026-09-30", notice_date = "2026-11-03" }

[question.expected_result]
notice_timely = true
deadlines = [
  { what = "60-day billing error notice window after periodic statement", date = 2026-11-29, rule = "1026.13(b)(1)" }
]

[[question]]
id = "q004"
stage = "labelled"
persona = "compliance"
type = "deadline"
question = """
We received written notice on Thursday, 5 November 2026, that a gym took an ACH payment after the \
customer cancelled. Her account has been open since 2019, and the transfer was within the United \
States. What deadlines apply, and what are the dates?
"""
regulation = "E"
today = 2026-11-05
gold_ids = ["1005.11(c)(1)", "1005.11(c)(2)"]
reference_answer = """
Under Regulation E, after receiving written notice on Thursday, 5 November 2026, the institution must investigate and determine if an error occurred within 10 business days (by Friday, 20 November 2026). If the institution requires additional time, it must provisionally credit the account by 20 November 2026 and complete its investigation within 45 calendar days (by Sunday, 20 December 2026). Results of the investigation must be reported to the consumer within three business days of completion.
"""
key_facts = [
  "investigate or provisionally credit within 10 business days (20 November 2026)",
  "complete investigation within 45 calendar days (20 December 2026)"
]
should_abstain = false

[question.expected_tool_call]
name = "dispute_timeline"
args = { regulation = "E", event = "error", notice_date = "2026-11-05", transfer_kind = "standard" }

[question.expected_result]
deadlines = [
  { what = "10-business-day provisional credit or investigation determination", date = 2026-11-20, rule = "1005.11(c)(1)" },
  { what = "45-calendar-day complete investigation", date = 2026-12-20, rule = "1005.11(c)(2)" }
]

[[question]]
id = "q005"
stage = "labelled"
persona = "compliance"
type = "fees_terms"
question = """
We want to raise the APR on existing fixed-rate cards from 21.99% to 24.99% because funding costs \
increased. What notice is required, and can the new rate apply to existing balances?
"""
regulation = "Z"
gold_ids = ["1026.9(c)(2)(i)", "1026.55(b)(3)"]
reference_answer = """
To increase the APR on fixed-rate credit cards, the card issuer must provide a written change-in-terms notice at least 45 days before the effective date of the change. Under Regulation Z, the increased rate can only apply to new transactions and cannot be applied to existing balances.
"""
key_facts = [
  "at least 45 days written advance notice is required",
  "the new rate cannot apply to existing balances"
]
should_abstain = false

[[question]]
id = "q006"
stage = "labelled"
persona = "frontline"
type = "payments_disclosures"
question = """
A customer paid her credit-card bill online at 7:30 p.m. Eastern on the due date, Tuesday, \
10 November 2026. Our website says payments after 5 p.m. Eastern count as next-day payments, so hers \
posted on 11 November and she was charged a late fee. Can we treat the payment as late and charge the fee?
"""
regulation = "Z"
gold_ids = ["1026.10(b)(2)(ii)"]
reference_answer = """
Under Regulation Z, a creditor may set a reasonable cut-off time for electronic payments on the due date, provided it is no earlier than 5 p.m. in the specified time zone. Because the customer made her online payment at 7:30 p.m. Eastern on the due date—after the permissible 5 p.m. Eastern cut-off time—the creditor may treat the payment as received on the next day and assess a late fee.
"""
key_facts = [
  "creditors may set an electronic payment cut-off time no earlier than 5 p.m. on the due date",
  "payments made after the 5 p.m. cut-off time may be treated as late and charged a fee"
]
should_abstain = false

[[question]]
id = "q007"
stage = "labelled"
persona = "compliance"
type = "unauthorized"
trap = "Reg E vs Reg Z"
question = """
A thief used a customer’s debit card, draining her checking balance and then drawing on its overdraft \
credit line. Which regulation determines her liability?
"""
regulation = "E"
gold_ids = ["1005.12(a)(1)(iv)(A)"]
reference_answer = """
Regulation E determines the customer's liability. Under 12 CFR § 1005.12(a)(1)(iv)(A), when an unauthorized electronic fund transfer involves an overdraft credit line linked to a checking account, Regulation E's liability limitations and error resolution rules govern the transaction rather than Regulation Z.
"""
key_facts = [
  "Regulation E determines liability",
  "Regulation E governs debit card transfers even when credit is extended via an overdraft line"
]
should_abstain = false

[[question]]
id = "q008"
stage = "labelled"
persona = "frontline"
type = "decline"
trap = "card-network zero liability"
question = """
A customer says someone used her Mastercard debit card and PIN for a fraudulent store purchase. Does \
Mastercard’s zero-liability protection cover it?
"""
gold_ids = ["1005.6(b)"]
reference_answer = """
Whether Mastercard's zero-liability policy covers this transaction is governed by private payment network rules rather than federal regulations. Regulation E provides statutory liability limits for unauthorized electronic fund transfers under federal law, but it does not regulate or enforce card network policies.
"""
key_facts = [
  "card network zero-liability rules are private policies not governed by Regulation E or Regulation Z",
  "the provided regulations do not contain card network zero-liability rules"
]
should_abstain = true
abstain_category = "network_rules"

[[question]]
id = "q009"
stage = "labelled"
persona = "compliance"
type = "decline"
trap = "credit report after a card dispute"
question = """
We resolved a credit-card dispute in the customer’s favour, but her credit report still shows a late payment. How soon must the bureaus correct it after we notify them?
"""
gold_ids = ["1026.13(g)(4)"]
reference_answer = """
Credit bureau correction timelines for reporting agencies are not governed by Regulation Z or Regulation E. Under Regulation Z (§ 1026.13(g)(4)), the card issuer is required to promptly notify credit bureaus of corrected billing errors, but the regulation does not set or enforce deadlines for credit bureaus themselves to update their reports.
"""
key_facts = [
  "credit bureau correction timelines for reporting agencies are not governed by Regulation Z",
  "Regulation Z requires the creditor to promptly notify bureaus of billing error corrections"
]
should_abstain = true
abstain_category = "other_law"

