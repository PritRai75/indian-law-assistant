[[question]]
id = "q011"
stage = "labelled"
persona = "frontline"
type = "unauthorized"
trap = "card once lent"
question = """
A customer says her roommate took her credit card from her purse and used it without asking. She had \
previously lent him the card once to buy groceries but did not authorize these later purchases. Does \
having lent him the card before affect how we treat the new transactions?
"""
regulation = "Z"
gold_ids = ["1026.12(b)(1)(i)", "1026.12(b)(1)(ii)-3"]
reference_answer = """
Under Regulation Z, unauthorized use is defined as the use of a credit card by a person who lacks actual, implied, or apparent authority and from which the cardholder receives no benefit. If a cardholder furnishes a card to a person who exceeds the granted authority, the cardholder is liable unless the issuer was notified that authority was revoked. However, whether previously lending a card creates implied or apparent authority for later purchases when the card is taken without permission is determined under state law.
"""
key_facts = [
  "unauthorized use is defined as use without actual, implied, or apparent authority from which the cardholder receives no benefit",
  "whether prior lending creates implied or apparent authority for subsequent use is determined under state law"
]
should_abstain = false

